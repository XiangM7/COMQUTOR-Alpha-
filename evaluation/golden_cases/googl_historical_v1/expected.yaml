# Structural/hygiene expectations only -- no fabricated domain oracle.
# See case.yaml notes for why activation/conflict correctness is left
# to manual review rather than an automated exact/range assertion.

graph:
  node_count:
    minimum: 0
  edge_count:
    minimum: 0
  zero_edges_allowed: true

conflicts:
  all_admitted_require_bull_evidence: true
  all_admitted_require_bear_evidence: true

claims:
  forbidden_patterns:
    - "I now have all the data"
    - "Let me synthesize"
    - "comprehensive report"
