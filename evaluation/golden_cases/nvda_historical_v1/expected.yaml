# Structural/hygiene expectations only -- no fabricated domain oracle.
# See case.yaml's `notes` for why activation/conflict correctness is left
# to manual review rather than an automated exact/range assertion.

graph:
  node_count:
    minimum: 0
  edge_count:
    minimum: 0
  # This run's admitted edges may legitimately be 0 for some future replay
  # of this source (e.g. after a stricter admission rule) -- explicitly
  # opting in to allow that, never assuming edges must always exist.
  zero_edges_allowed: true

conflicts:
  all_admitted_require_bull_evidence: true
  all_admitted_require_bear_evidence: true

claims:
  forbidden_patterns:
    - "I now have all the data"
    - "Let me synthesize"
    - "comprehensive report"
