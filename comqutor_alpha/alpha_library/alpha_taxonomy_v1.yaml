schema_version: alpha_taxonomy_v1
source_note: >-
  MVP identifiers, names, layers, required relations, acceptance examples, and the
  A101/A304 weight come from COMQUTOR Alpha Development Plan v1.0. Other numeric
  seed weights were recovered from the user's committed project taxonomy at
  commit 9b2b8a5 and require product confirmation because the referenced full
  Alpha Taxonomy v1.0 document was not supplied in the current source set.
review_status: pending_product_review
alphas:
  - alpha_id: A001
    name_en: Rate Cut Cycle
    name_cn: 利率下降周期
    layer: Macro
    status: active
    core_thesis: Falling discount rates support long-duration and growth assets.
    keywords: [rate cut, falling rates, lower rates, fed cut, easing cycle, discount rate, duration, treasury yield]
    trigger_signals: [Fed pivots dovish, yields fall, inflation cools]
    confirmation_signals: [growth multiples expand, financial conditions ease]
    beneficiary_assets: [growth equities, technology, long-duration assets, QQQ]
    risk_assets: [cash, short-duration defensives]
    conflict_alphas:
      - alpha_id: A501
        contradiction_weight: 0.85
        source_note: Recovered committed seed; pending product confirmation.
        review_status: pending_product_review
    invalidation_conditions: [inflation reaccelerates, rates rise, Fed stays restrictive]
    agent_sources: [news, fundamentals, market]
    causal_graph:
      - {source: A001, target: A304, relation_type: relieves, weight: 0.70, source_note: "Required relation; recovered seed weight pending review."}
      - {source: A001, target: A601, relation_type: amplifies, weight: 0.65, source_note: "Required relation; recovered seed weight pending review."}
    source_note: Development Plan MVP structure plus recovered engineering seed fields.
    review_status: pending_product_review

