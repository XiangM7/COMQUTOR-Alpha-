schema_version: alpha_taxonomy_v1
alphas:
  - alpha_id: A001
    name_en: Rate Cut Cycle
    name_cn: 利率下降周期
    layer: Macro
    status: active
    core_thesis: Falling rates lower discount rates and support long-duration growth assets.
    keywords: [rate cut, falling rates, lower rates, fed cut, easing cycle, discount rate, duration, treasury yield]
    trigger_signals: [Fed pivots dovish, yields fall, inflation cools]
    confirmation_signals: [growth multiples expand, financial conditions ease]
    beneficiary_assets: [growth equities, technology, long-duration assets, QQQ]
    risk_assets: [cash, short-duration defensives]
    conflict_alphas:
      - alpha_id: A501
        contradiction_weight: 0.85
    invalidation_conditions: [inflation reaccelerates, rates rise, Fed stays restrictive]
    agent_sources: [news_agent, fundamental_agent, technical_agent]
    relations:
      - target_alpha_id: A304
        relation_type: relieves
        weight: 0.70
      - target_alpha_id: A601
        relation_type: amplifies
        weight: 0.65

  - alpha_id: A003
    name_en: Liquidity Expansion
    name_cn: 流动性扩张
    layer: Macro
    status: active
    core_thesis: Improving liquidity supports risk appetite and equity inflows.
    keywords: [liquidity, liquidity conditions, liquidity expansion, monetary liquidity, cash deployment, risk appetite, risk assets, money supply, reserves]
    trigger_signals: [cash moves into risk assets, liquidity improves, reserves rise]
    confirmation_signals: [broad equity participation, credit conditions improve]
    beneficiary_assets: [equities, growth assets, high beta, QQQ]
    risk_assets: [cash, credit stress hedges]
    conflict_alphas:
      - alpha_id: A501
        contradiction_weight: 0.85
    invalidation_conditions: [liquidity drains, credit tightens, cash hoarding rises]
    agent_sources: [news_agent, sentiment_agent, technical_agent]
    relations:
      - target_alpha_id: A601
        relation_type: amplifies
        weight: 0.70
      - target_alpha_id: A304
        relation_type: relieves
        weight: 0.60

  - alpha_id: A101
    name_en: AI Expansion
    name_cn: AI 扩张
    layer: Theme
    status: active
    core_thesis: AI training and adoption increase demand for accelerators and AI-related equities.
    keywords: [AI, artificial intelligence, AI training, training workload, GPU, accelerator, NVIDIA, NVDA, cloud AI, AI capex]
    trigger_signals: [AI training demand increases, cloud providers raise AI capex]
    confirmation_signals: [GPU demand rises, accelerator supply tightens, AI revenue grows]
    beneficiary_assets: [NVDA, semiconductor leaders, cloud infrastructure]
    risk_assets: [legacy compute, non-AI software laggards]
    conflict_alphas:
      - alpha_id: A304
        contradiction_weight: 0.90
    invalidation_conditions: [AI capex cuts, model demand slows, GPU oversupply]
    agent_sources: [news_agent, fundamental_agent, sentiment_agent]
    relations:
      - target_alpha_id: A103
        relation_type: supportive
        weight: 0.85
      - target_alpha_id: A201
        relation_type: supportive
        weight: 0.75
      - target_alpha_id: A301
        relation_type: supportive
        weight: 0.80
      - target_alpha_id: A601
        relation_type: supportive
        weight: 0.65

  - alpha_id: A102
    name_en: Inference Explosion
    name_cn: 推理爆发
    layer: Theme
    status: active
    core_thesis: Enterprise AI applications and AI agents increase inference compute demand.
    keywords: [inference, AI inference, enterprise AI, AI applications, AI agents, inference workload, token generation]
    trigger_signals: [enterprise AI usage rises, inference workloads grow]
    confirmation_signals: [cloud inference capacity expands, deployment activity rises]
    beneficiary_assets: [AI chips, cloud platforms, datacenter infrastructure]
    risk_assets: [CPU-only workloads]
    conflict_alphas: []
    invalidation_conditions: [enterprise AI adoption slows, inference costs block deployment]
    agent_sources: [news_agent, fundamental_agent]
    relations:
      - target_alpha_id: A103
        relation_type: supportive
        weight: 0.80
      - target_alpha_id: A301
        relation_type: supportive
        weight: 0.70

  - alpha_id: A103
    name_en: AI Infrastructure
    name_cn: AI 基础设施
    layer: Infrastructure
    status: active
    core_thesis: AI buildout drives datacenter, power, cooling, networking, and server demand.
    keywords: [datacenter, data center, AI infrastructure, power demand, cooling, networking, server, AI buildout, capex]
    trigger_signals: [datacenter spending rises, power and cooling demand increases]
    confirmation_signals: [networking orders rise, server demand rises]
    beneficiary_assets: [AI infrastructure suppliers, power equipment, networking, servers]
    risk_assets: [underinvested infrastructure]
    conflict_alphas: []
    invalidation_conditions: [datacenter capex delayed, infrastructure bottlenecks worsen]
    agent_sources: [news_agent, fundamental_agent]
    relations:
      - target_alpha_id: A301
        relation_type: supportive
        weight: 0.65

  - alpha_id: A201
    name_en: Semiconductor Supercycle
    name_cn: 半导体超级周期
    layer: Industry
    status: active
    core_thesis: A chip-cycle upturn improves inventory, pricing, capex, and semiconductor demand.
    keywords: [semiconductor, chip, chip demand, inventory improving, inventory recovery, ASP, wafer, orders, capex recovery]
    trigger_signals: [inventory improves, orders recover, chip demand rises]
    confirmation_signals: [ASP stabilizes, capex recovers, backlog improves]
    beneficiary_assets: [semiconductor equities, equipment makers, NVDA]
    risk_assets: [semiconductor shorts]
    conflict_alphas: []
    invalidation_conditions: [inventory glut returns, order cuts resume]
    agent_sources: [fundamental_agent, news_agent, technical_agent]
    relations:
      - target_alpha_id: A301
        relation_type: supportive
        weight: 0.75

  - alpha_id: A301
    name_en: Revenue Expansion
    name_cn: 收入扩张
    layer: Fundamental
    status: active
    core_thesis: Strong demand raises revenue guidance, EPS revisions, and repricing potential.
    keywords: [revenue, revenue growth, guidance raised, strong demand, EPS revisions, customer demand, sales growth, beat and raise]
    trigger_signals: [guidance raised, demand beats expectations, revenue accelerates]
    confirmation_signals: [EPS revisions rise, margins hold, bookings strengthen]
    beneficiary_assets: [profitable growth equities, NVDA]
    risk_assets: [low-growth equities]
    conflict_alphas:
      - alpha_id: A304
        contradiction_weight: 0.85
    invalidation_conditions: [revenue misses, guide-down, demand weakens]
    agent_sources: [fundamental_agent, news_agent]
    relations: []

  - alpha_id: A304
    name_en: Multiple Compression
    name_cn: 估值压缩
    layer: Valuation
    status: active
    core_thesis: Rich valuation and high multiples create downside risk despite strong fundamentals.
    keywords: [valuation, high valuation, rich valuation, multiple compression, downside risk, expensive, PE multiple, priced for perfection]
    trigger_signals: [multiples stretch, valuation risk rises, discount rate rises]
    confirmation_signals: [stock falls despite earnings, estimates fail to support price]
    beneficiary_assets: [value rotation, hedges]
    risk_assets: [expensive growth equities, crowded AI stocks]
    conflict_alphas:
      - alpha_id: A101
        contradiction_weight: 0.90
      - alpha_id: A301
        contradiction_weight: 0.85
      - alpha_id: A601
        contradiction_weight: 0.80
    invalidation_conditions: [earnings growth exceeds valuation, rates fall sharply]
    agent_sources: [fundamental_agent, technical_agent, risk_agent]
    relations: []

  - alpha_id: A501
    name_en: Recession Risk
    name_cn: 衰退风险
    layer: MacroRisk
    status: active
    core_thesis: Widening credit spreads and economic slowdown pressure earnings and risk appetite.
    keywords: [recession, recession risk, economic slowdown, credit spreads, widening spreads, earnings recession, slowdown, default risk]
    trigger_signals: [credit spreads widen, unemployment rises, PMIs weaken]
    confirmation_signals: [earnings estimates fall, defensives outperform]
    beneficiary_assets: [defensives, cash, treasuries]
    risk_assets: [cyclicals, high beta, growth equities]
    conflict_alphas:
      - alpha_id: A001
        contradiction_weight: 0.85
      - alpha_id: A003
        contradiction_weight: 0.85
      - alpha_id: A601
        contradiction_weight: 0.80
    invalidation_conditions: [growth accelerates, spreads tighten, earnings improve]
    agent_sources: [news_agent, fundamental_agent]
    relations: []

  - alpha_id: A601
    name_en: Narrative Momentum
    name_cn: 叙事动量
    layer: Sentiment
    status: active
    core_thesis: Investor attention and crowded narratives drive reflexive flows and momentum.
    keywords: [narrative, narrative momentum, investor attention, crowded trade, reflexive flows, momentum, AI stocks, sentiment, attention]
    trigger_signals: [media attention rises, flows chase theme, price momentum strengthens]
    confirmation_signals: [sentiment improves, breadth within theme expands]
    beneficiary_assets: [theme leaders, high-momentum equities, NVDA]
    risk_assets: [ignored assets, low-momentum names]
    conflict_alphas:
      - alpha_id: A304
        contradiction_weight: 0.80
      - alpha_id: A501
        contradiction_weight: 0.80
    invalidation_conditions: [narrative fatigue, flow reversal, positioning unwind]
    agent_sources: [sentiment_agent, news_agent, technical_agent]
    relations: []
