name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-offline:
    name: Backend offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[api,dev]"
      - name: Verify dependencies
        run: python -m pip check
      - name: Ruff maintained Python surface
        run: >-
          python -m ruff check
          comqutor_alpha/api/agent_output_reader.py
          comqutor_alpha/api/routes_research.py
          comqutor_alpha/api/routes_system.py
          comqutor_alpha/research_jobs.py
          comqutor_alpha/research_lifecycle.py
          comqutor_alpha/research_profiles.py
          comqutor_alpha/research_progress.py
          comqutor_alpha/runners/tradingagents_runner.py
          comqutor_alpha/server_execution.py
          comqutor_alpha/storage/db/repository.py
          comqutor_alpha/storage/db/schema.py
          comqutor_alpha/storage/db/week4_persistence.py
          comqutor_alpha/structure_engine/structured_output_adapter.py
          scripts/seed_w5_demo.py
          tests/test_agent_outputs_persistence.py
          tests/test_agent_outputs_postgres_integration.py
          tests/test_graph_api.py
          tests/test_graph_persistence.py
          tests/test_live_research_final_closure.py
          tests/test_research_jobs.py
          tests/test_research_input_validation.py
          tests/test_research_lifecycle.py
          tests/test_research_profiles.py
          tests/test_research_progress.py
          tests/test_research_progress_postgres_integration.py
          tests/test_research_runs_api.py
          tests/test_research_runs_persistence.py
          tests/test_server_execution.py
          tests/test_structured_output_adapter.py
          tests/test_tradingagents_progress_runner.py
          tests/test_api_system_routes.py
          tests/test_w5_1b_postgres_integration.py
          tests/test_w5_1b_api.py
          tests/test_w5_demo_seed.py
          tests/test_week2_labeled_accuracy.py
          tests/test_week3_security_hardening.py
          tests/test_week4_golden_closure.py
          tests/test_week4_persistence.py
      - name: Offline tests
        env:
          COMQUTOR_DATABASE_URL: ""
          COMQUTOR_ENV: ""
        run: python -m pytest -m "not integration" -q
      - name: Whitespace errors
        run: git show --check --oneline --no-renames HEAD

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: comqutor
          POSTGRES_PASSWORD: comqutor_test_password
          POSTGRES_DB: comqutor_alpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comqutor -d comqutor_alpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COMQUTOR_TEST_DATABASE_URL: postgresql+psycopg://comqutor:comqutor_test_password@127.0.0.1:5432/comqutor_alpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[api,dev]"
      - name: PostgreSQL persistence tests
        run: >-
          python -m pytest
          tests/test_agent_outputs_postgres_integration.py
          tests/test_graph_persistence_postgres_integration.py
          tests/test_research_progress_postgres_integration.py
          tests/test_research_runs_postgres_integration.py
          tests/test_w5_1b_postgres_integration.py
          tests/test_week4_postgres_persistence.py
          -q
