services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

  # Optional local PostgreSQL for Week 3 alpha_matches/structure_graphs
  # persistence. Not started by default; opt in with:
  #   docker compose --profile postgres up -d postgres
  # Then point the server at it (never read from an HTTP request):
  #   COMQUTOR_DATABASE_URL=postgresql+psycopg://comqutor:comqutor@localhost:5433/comqutor_alpha
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=comqutor
      - POSTGRES_PASSWORD=comqutor
      - POSTGRES_DB=comqutor_alpha
    ports:
      - "5433:5432"
    volumes:
      - comqutor_postgres_data:/var/lib/postgresql/data
    profiles:
      - postgres

volumes:
  tradingagents_data:
  ollama_data:
  comqutor_postgres_data:
