    content_version 1.1.0).
  reason: PD-017-REVISED (docs/specs/product_decisions_and_unknowns.md); COMQUTOR
    Alpha next-round task sheet, T2 first item.
- date: '2026-10-07'
  change: 'Added taxonomy_content_version (1.1.0) so the formal acceptance entry can
    verify label/taxonomy compatibility. Added the five John-baseline pairs this file
    did not carry to allowed_conflicts: QQQ A003__A501 and A304__A601, MSFT A101__A304
    and A301__A304, TSM A101__A304.'
  reason: 'docs/audit_artifacts/v0_2_john_frozen_gold_baseline.yaml (authority JOHN_WRITTEN_V0_2_BASELINE)
    lists all 16 ticker-pair allowed_main_conflicts, and its implementation_alignment_required
    section records these five as missing from every repo rule file. John files them
    under allowed_main_conflicts; the equivalent field here is allowed_conflicts (legal
    structures, never mandatory; absence is never a failure and raises no review).
    The ten pairs already carried under conditional_conflicts were left untouched
    (task sheet: existing equivalent fields may stay).'
  effect: 'Admitted QQQ A003__A501 / A304__A601, MSFT A301__A304 and TSM A101__A304
    are no longer reported as undeclared admitted conflicts. OPEN QUESTION FOR JOHN:
    whether all 16 pairs should be allowed_conflicts instead of ten being conditional_conflicts.
    It changes results: conditional pairs feed should_detect_if_supported (soft-miss
    review), so moving them would turn SNDK from needs_review to pass.'
